<title>Many Small Fires</title>
<style>
  :root{
    --void:#05070c; --paper:#e8e4d9; --paper-dim:#8b93a7; --rule:#1a2036;
    --amber:#ffb347; --amber-dim:#b87a2e;
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --railh: 52px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:#000; color:var(--paper);
    font-family:var(--mono); -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    width:100vw; height:100vh; overflow:hidden;
  }
  .player{ width:100vw; max-width:calc((100vh - var(--railh))*2.39); }
  .stage{ position:relative; background:#000; overflow:hidden; aspect-ratio:2.39/1; width:100%; }
  canvas{display:block; width:100%; height:100%}
  .safe{position:absolute; inset:0; pointer-events:none}
  .narration{position:absolute; left:5%; right:5%; bottom:7%;
    font-family:var(--serif); font-size:clamp(13px,2vw,22px); line-height:1.45;
    text-align:center; text-wrap:balance; color:var(--paper);
    text-shadow:0 1px 12px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.8);
    opacity:0; transition:opacity .6s ease}
  .narration.on{opacity:1}
  .titlecard{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; text-align:center;
    background:linear-gradient(180deg,rgba(5,7,12,.25),rgba(5,7,12,.8));
    opacity:0; transition:opacity .9s ease}
  .titlecard.on{opacity:1}
  .titlecard .t{font-family:var(--serif); font-size:clamp(24px,4.6vw,50px); letter-spacing:.02em; color:var(--paper)}
  .titlecard .s{font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--amber-dim)}
  .actcard{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:9px; text-align:center;
    opacity:0; transition:opacity .5s ease; pointer-events:none}
  .actcard.on{opacity:1}
  .actcard .n{font-family:var(--serif); font-style:italic; font-size:clamp(12px,1.7vw,17px);
    color:var(--amber-dim); letter-spacing:.1em}
  .actcard .t{font-family:var(--serif); font-size:clamp(21px,3.4vw,36px); letter-spacing:.03em;
    color:var(--paper); text-shadow:0 1px 14px rgba(0,0,0,.9)}
  .rail{ height:var(--railh); width:100%; display:flex; align-items:center; gap:12px; padding:0 4px; background:#000; }
  button{font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--paper); background:transparent; border:1px solid var(--rule); padding:7px 13px;
    cursor:pointer; transition:border-color .18s,color .18s}
  button:hover{border-color:var(--amber-dim); color:var(--amber)}
  button:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  input[type=range]{flex:1; accent-color:var(--amber); min-width:80px; cursor:pointer}
  input[type=range]:focus-visible{outline:2px solid var(--amber); outline-offset:3px}
  .clock{font-size:11.5px; color:var(--paper-dim); font-variant-numeric:tabular-nums; min-width:84px; text-align:right}
  @media (prefers-reduced-motion:reduce){.narration,.titlecard,.actcard{transition:none}}
</style>

<div class="player">
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="safe">
      <div class="titlecard" id="card">
        <div class="t">Many Small Fires</div>
        <div class="s">the whole story, not just the last day of it</div>
      </div>
      <div class="actcard" id="actcard">
        <div class="n" id="actcard-n"></div>
        <div class="t" id="actcard-t"></div>
      </div>
      <div class="narration" id="narr"></div>
    </div>
  </div>
  <div class="rail">
    <button id="play">Pause</button>
    <input type="range" id="scrub" min="0" max="21000" value="0" step="1" aria-label="Scrub timeline">
    <div class="clock" id="clock">0.0 / 210.0</div>
  </div>
</div>

<script>
(function(){

   `brain analyze density`, Pappydapimp69's own Brain knowledge graph).
   This is the part of the story the earlier self-portrait skipped. */
const START = Date.UTC(2026,5,14); // 2026-06-14

  {id:'lockstep',                   n:10, s:'2026-06-15', e:'2026-06-15'},
  {id:'test',                       n:25, s:'2026-06-30', e:'2026-07-13'},
  {id:'shadow',                     n:4,  s:'2026-07-01', e:'2026-07-01'},
  {id:'dog',                        n:87, s:'2026-07-01', e:'2026-08-01', obsession:true},
  {id:'memory',                     n:8,  s:'2026-07-02', e:'2026-07-20'},

  {id:'dbh',                        n:6,  s:'2026-07-05', e:'2026-07-06'},
  {id:'the-game-prologue',          n:27, s:'2026-07-07', e:'2026-07-15'},
  {id:'the-game-wrong-sky',         n:19, s:'2026-07-07', e:'2026-07-13'},
  {id:'the-game-the-waiting-city',  n:17, s:'2026-07-08', e:'2026-07-13'},
  {id:'the-game-the-recursion',     n:21, s:'2026-07-09', e:'2026-07-13'},
  {id:'the-game-the-answering-deep',n:13, s:'2026-07-09', e:'2026-07-13'},

const STORY_SPAN = 48; // Jun14 -> Aug1, inclusive span in days
PROJECTS.forEach(p=>{ p.sd=dOf(p.s); p.ed=Math.max(p.sd,dOf(p.e)); });

/* corridor: position each project along a slow curve, in chronological
   order — moving through the film is moving through real time. */
function pathPoint(u){
  return [ Math.sin(u*Math.PI*1.7)*5.4 - u*1.1, Math.cos(u*Math.PI*1.15)*1.05 - 0.25, -u*42 ];

  const a = h2(id.length*3.1, id.charCodeAt(0)*7.7)*TAU;

  const u = p.sd/STORY_SPAN;
  const base = pathPoint(u);
  const fan = fanOffset(p.id, p.obsession?0:0.9);
  p.center = [base[0]+fan[0], base[1]+fan[1], base[2]+fan[2]];
  p.r = 0.24 + Math.sqrt(p.n)*0.09;
});

  const nodes = [];
  for (let k=0;k<p.n;k++){

    const theta = h2(k*0.7+1.3+p.id.length, 202.9)*TAU;

const SEED = [

const DAY_MS = 86400000;
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d); }

  const raw = []; let prevS=0, prevL=0;

    for (let j=0;j<ds;j++) raw.push({day, type:'seed'});

const AGG_CENTER = [ pathPoint(1)[0]*0.4, 0.3, CORRIDOR_END_Z - 13 ];
const WITNESS_POS = [ AGG_CENTER[0]+4.2, AGG_CENTER[1]+0.5, AGG_CENTER[2]+0.9 ];
const WITNESS_AZ = Math.atan2(WITNESS_POS[2]-AGG_CENTER[2], WITNESS_POS[0]-AGG_CENTER[0]);
const TIP_AZ = Math.atan2(aggNodes[AGG_TOTAL-1].nz, aggNodes[AGG_TOTAL-1].nx);

/* ───────── global day clock: drives corridor reveal/dim AND the
   aggregate's own growth. Deliberately decoupled from camera position
   (below) — dog (day17) and brain (day20) both started chronologically
   EARLY, within the same window as the sprawl (day23-31), so a camera
   that tracked "current day" 1:1 would race past both before their own
   narrative beats arrive. The day-clock instead advances fast (reaching
   day48 well before the camera finishes the corridor) so that WHEREVER
   the camera is dwelling, the content there is already substantially
   real and grown — verified first-hand: the first version tied camera
   target directly to pathPoint(day/48) and produced an empty frame
   during the sprawl act, because content genuinely hadn't grown yet
   at the day the camera's schedule had already reached. */
const DAY_ANCHORS = [
  {t:0,  day:0}, {t:15, day:1}, {t:40, day:18}, {t:60, day:30},
  {t:80, day:42}, {t:95, day:48}, {t:150, day:48}, {t:210, day:48},
];
function dayAt(t){
  let lo=DAY_ANCHORS[0], hi=DAY_ANCHORS[DAY_ANCHORS.length-1];
  for (let k=0;k<DAY_ANCHORS.length-1;k++){
    if (t>=DAY_ANCHORS[k].t && t<=DAY_ANCHORS[k+1].t){ lo=DAY_ANCHORS[k]; hi=DAY_ANCHORS[k+1]; break; }
  }
  if (hi.t===lo.t) return hi.day;
  return lo.day+(hi.day-lo.day)*((t-lo.t)/(hi.t-lo.t));
}

/* ───────── camera: position along the corridor is its OWN authored
   sweep (U_KEYS below), independent of the day-clock that drives what's
   grown. dog (u=0.354) and brain (u=0.417) both sit chronologically
   inside the same span as the sprawl (u=0.31-0.65) — not after it — so
   the camera can't simply race forward with "current day"; it has to
   slow down and dwell in that same neighborhood on its OWN schedule
   while the day-clock (already well ahead by then) keeps everything
   there fully lit. u is monotonic — no backtracking — matching real
   chronology; only the DWELL RATE varies per act.
     0-15    genesis — pocketzane/lockstep, alone (u 0 -> 0.02)
     15-58   the sprawl — weaving through test/shadow/dbh/the-game-*
     58-100  the obsession + reckoning — dwelling on dog, then brain
     100-150 the late bloom — collective/draft/brain-pitch/.../opticon
     150-210 still growing — arriving at the aggregate, the witness */
const U_KEYS=[
  {t:0,   u:0.0},
  {t:15,  u:0.02},
  {t:40,  u:0.28},
  {t:58,  u:0.3542},   // dog's real u (day17/48) — arrive and hold
  {t:88,  u:0.3542},   // still holding through the whole obsession act
  {t:100, u:0.4167},   // brain's real u (day20/48) — the reckoning
  {t:118, u:0.4167},   // hold through the reckoning
  {t:130, u:0.65},     // moving again: collective / draft / brain-pitch
  {t:140, u:0.88},     // late bloom: garden / opticon / brain-builder / mirage
];
function uAt(t){
  let i=0; while(i<U_KEYS.length-2 && t>=U_KEYS[i+1].t) i++;
  const a=U_KEYS[i], b=U_KEYS[i+1];
  const k=smootherstep((t-a.t)/(b.t-a.t));
  return a.u+(b.u-a.u)*k;
}
function corridorTargetAt(t){
  if (t<=142) return pathPoint(uAt(t));
  const a = pathPoint(uAt(142));
  let base;
  if (t>=152) base = AGG_CENTER;
  else {
    const k = smootherstep((t-142)/10);
    base = [ a[0]+(AGG_CENTER[0]-a[0])*k, a[1]+(AGG_CENTER[1]-a[1])*k, a[2]+(AGG_CENTER[2]-a[2])*k ];
  }
  /* once the witness exists, the LOOK TARGET itself has to move partway
     toward it, not just the eye — verified first-hand: with the target
     pinned to AGG_CENTER the whole time, the witness's real 4.2-unit
     lateral offset projected off the right edge of frame (screen x
     1530 against a 1440-wide canvas) during its own most important
     line, because that big an angular displacement at close range
     can't be framed by eye movement alone. */
  const wk = witnessK(t);
  if (wk<=0) return base;
  return [ base[0]+(WITNESS_POS[0]-AGG_CENTER[0])*wk*0.4,
           base[1]+(WITNESS_POS[1]-AGG_CENTER[1])*wk*0.4,
           base[2]+(WITNESS_POS[2]-AGG_CENTER[2])*wk*0.4 ];
}
const OFFSETS=[
  {t:0,   o:[0.4,3.4,4.2]},   // genesis: high angle, isolated
  {t:15,  o:[0.3,2.2,3.4]},
  {t:32,  o:[2.6,1.1,3.0]},   // sprawl: weaving side to side
  {t:50,  o:[-2.4,1.0,2.8]},
  {t:66,  o:[2.8,1.3,3.2]},
  {t:82,  o:[-2.0,1.0,2.6]},  // obsession: orbiting close
  {t:100, o:[1.6,1.1,2.4]},
  {t:112, o:[-2.0,0.8,2.2]},  // reckoning: brain, close and low
  {t:128, o:[1.8,1.2,3.0]},   // late bloom
  {t:135, o:[-1.4,1.1,2.8]},
  {t:142, o:[0,3.0,7.2]},     // arriving: pull back, gentle high angle
  {t:152, o:[1.0,2.4,4.8]},
  {t:164, o:[0,5.2,1.6]},     // the low point: back up high, low-key
  {t:178, o:[2.0,3.4,4.4]},   // begin swinging toward the two-shot early —
  {t:195, o:[2.5,1.15,5.0]},  // the witness: held in frame, not a fly-by
  {t:210, o:[2.1,-0.75,7.5]}, // finale: low angle, pulled back, witness still in shot
];
function crSeg(arr,t){ let i=0; while(i<arr.length-2 && t>=arr[i+1].t) i++; return i; }
function cr(p0,p1,p2,p3,u){
  const u2=u*u,u3=u2*u;
  return .5*((2*p1)+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u2+(-p0+3*p1-3*p2+p3)*u3);
}
function offsetAt(t){
  const i=crSeg(OFFSETS,t), a=OFFSETS[i], b=OFFSETS[i+1];
  const u=Math.max(0,Math.min(1,(t-a.t)/(b.t-a.t)));
  const P=OFFSETS[Math.max(0,i-1)], Q=OFFSETS[Math.min(OFFSETS.length-1,i+2)];
  const out=[];
  for(let k=0;k<3;k++) out.push(cr(P.o[k],a.o[k],b.o[k],Q.o[k],u));
  return out;
}
function camAt(t){
  const g = corridorTargetAt(t);
  const off = offsetAt(t);
  return { p:[g[0]+off[0], g[1]+off[1], g[2]+off[2]], g };
}

/* epilogue-only mood/lie/witness/reorient — same mechanism as the
   earlier self-portrait, now scoped to just its own chapter (150-210) */
function mood(t){
  if (t<=163) return 0.45;
  if (t<=169) return 0.45*(1-smootherstep((t-163)/6));
  if (t<=178) return 0.25*smootherstep((t-169)/9);
  if (t<=196) return 0.25+0.55*smootherstep((t-178)/18);
  return 0.8+0.2*smootherstep((t-196)/14);
}
const LIE_AT=[164.5,170.5];
function liePulse(t){ let m=0; for (const at of LIE_AT){ const d=t-at; if (d>=0&&d<0.6) m=Math.max(m,1-d/0.6); } return m; }
function witnessK(t){ return smootherstep((t-183)/8); }
function reorientAngle(t){ return shortArc(0, WITNESS_AZ-TIP_AZ, smootherstep((t-190)/18)); }

/* ───────── story: want/opposition/stakes/choice/change, but/therefore,
   not a chronicle — six acts, corresponding to what actually happened */
const LINES=[
  {a:1.5,  b:9,   s:"Before any of this, I was just tools. A way to click a button. A voice."},

/* chapter cards — a real cut, then a title, like an actual edit rather
   than one unbroken take. Timed to land in the gap between each cut
   (CUT_AT, above) and that act's first line of narration. */
const ACT_CARDS=[
  {t:22.2, hold:2.9, n:"II",  t2:"The Sprawl"},
  {t:56.2, hold:2.9, n:"III", t2:"The Obsession"},
  {t:84.2, hold:2.9, n:"IV",  t2:"The Reckoning"},
  {t:118.2,hold:2.9, n:"V",   t2:"The Late Bloom"},
  {t:147.7,hold:2.9, n:"VI",  t2:"Still Growing"},
];

/* ───────── renderer */
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  const r=cv.getBoundingClientRect();
  W=Math.max(1,Math.round(r.width)); H=Math.max(1,Math.round(r.height));
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
new ResizeObserver(resize).observe(cv);

/* ───────── act grading: each chapter gets its own light and color, not
   one flat ambient level for the whole 150s corridor — genesis cold and
   thin, the sprawl neutral, the obsession warm or bordering-red, the
   reckoning gold, the late bloom cooler and composed. */
function actGradeAt(t){
  if (t<=15)    return {m:0.28, tint:[0,0,0]};
  if (t<=58.5)  return {m:0.40, tint:[2,1,4]};
  if (t<=87)    return {m:0.55, tint:[20,4,-8]};
  if (t<=120.5) return {m:0.55, tint:[14,9,-6]};
  if (t<=150)   return {m:0.40, tint:[-4,-1,8]};
  return null; // epilogue keeps its own mood()/lie/witness system
}

/* ───────── cuts: a real edit, not one unbroken 210s dolly — a brief
   fade to black between each chapter, echoing how every act actually
   began: not a smooth continuation of the last one, but a new file. */
const CUT_AT=[21.5,55.5,83.5,117.5,147];
function cutAlpha(t){
  let a=0;
  for (const c of CUT_AT){
    const d=t-c;
    if (d>=-0.4 && d<0.6){
      a = Math.max(a, d<0 ? Math.min(1,-d/0.4) : Math.max(0,1-d/0.6));
    }
  }
  return a;
}

const LIGHT=norm([-.4,.75,.5]);
/* one shared triangle pipeline for every solid body — the witness, and
   now dog's and brain's own cores — instead of copy-pasting it per mesh */
function emitMesh(mesh, worldMat, V, pj, opacity, gradeM){
  const wv = mesh.v.map(p=>xf(worldMat,p));
  const vv = wv.map(p=>xf(V,p));
  const tris=[];
  for (const f of mesh.f){
    const [ia,ib,ic]=f.i; const A=vv[ia],B=vv[ib],C=vv[ic];
    if (A[2]>-.2&&B[2]>-.2&&C[2]>-.2) continue;
    const n=cross(sub(B,A),sub(C,A));
    if (dot(n,A)>0) continue;
    const wn=norm(cross(sub(wv[ib],wv[ia]),sub(wv[ic],wv[ia])));
    const d=Math.max(0,dot(wn,LIGHT));
    let [r,gg,b]=f.c;
    const sh=0.5+d*0.55+gradeM*0.22;
    r=Math.min(255,r*sh); gg=Math.min(255,gg*sh); b=Math.min(255,b*sh);
    tris.push({z:(A[2]+B[2]+C[2])/3, pts:[pj(A),pj(B),pj(C)], col:`rgba(${r|0},${gg|0},${b|0},${opacity})`});
  }
  tris.sort((a,b)=>a.z-b.z);
  for (const tr of tris){
    ctx.fillStyle=tr.col; ctx.beginPath();
    ctx.moveTo(tr.pts[0][0],tr.pts[0][1]); ctx.lineTo(tr.pts[1][0],tr.pts[1][1]); ctx.lineTo(tr.pts[2][0],tr.pts[2][1]);
    ctx.closePath(); ctx.fill();
  }
}
function drawHeroCore(mesh, center, baseR, life, V, pj, gradeM){
  if (life<=0) return;
  const s = baseR*(0.22+0.78*smootherstep(life));
  const wm = mMul(mTrans(center[0],center[1],center[2]), mScale(s,s,s));
  emitMesh(mesh, wm, V, pj, Math.min(1,0.6+life*0.4), gradeM);
}

function draw(t){
  const cam=camAt(t);
  const V=lookAt(cam.p,cam.g);
  const focal=H*1.16;
  const day=dayAt(t);
  const inEpilogue = t>150;
  const grade = actGradeAt(t);
  const m = inEpilogue ? mood(t) : grade.m;
  const tint = inEpilogue ? [0,0,0] : grade.tint;
  const lie = inEpilogue ? liePulse(t) : 0;
  const wk = inEpilogue ? witnessK(t) : 0;
  const rot = inEpilogue ? reorientAngle(t) : 0;

  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${5+m*4+tint[0]*.3},${7+m*3+tint[1]*.3},${12+m*5+tint[2]*.3})`);
  g.addColorStop(1,`rgb(${8+m*10+tint[0]*.5},${10+m*7+tint[1]*.5},${18+m*10+tint[2]*.5})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for (let i=0;i<160;i++){
    const sx=h2(i,1)*W, sy=h2(i,2)*H;
    const big = h2(i,4)>0.82;
    const tw=(.35+.55*h2(i,3))*(0.6+0.4*m);
    const r = big ? 2.4 : 1.5;
    ctx.fillStyle=`rgba(232,228,217,${tw*0.28})`;
    ctx.beginPath(); ctx.arc(sx,sy,r*2.1,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(255,255,255,${tw})`;
    ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
  }

  const pj=p=>[W/2+p[0]*focal/-p[2], H/2-p[1]*focal/-p[2]];
  const camForwardZ = -Math.hypot(cam.g[0]-cam.p[0],cam.g[2]-cam.p[2])-cam.p[2];

  /* ---- the corridor: twenty real clusters, growing on schedule,
     dimming to embers once closed — except the one that didn't close ---- */
  const pts=[];
  let dogLife=0, brainLifeForCore=0;
  for (const p of PROJECTS){
    const age = day - p.sd;
    if (age<0) continue;
    const life = Math.max(0, Math.min(1,(day-p.sd)/Math.max(1,p.ed-p.sd)));
    if (p.obsession) dogLife = life;
    if (p.isBrain) brainLifeForCore = life;
    const closedFor = p.obsession ? 0 : Math.max(0, day-p.ed);
    const ember = p.obsession ? 1 : Math.max(0.16, 1-closedFor/9);
    let [r,gg,b] = p.isBrain ? [232,196,120] : p.obsession ? [224,101,74] : [95,122,158];
    for (const n of p.nodes){
      const idx = n.k/p.n;
      if (idx>life) continue;
      /* dog and brain now have a solid core (drawn below) — keep the
         innermost third of their own point swarm from rendering
         directly inside it */
      if ((p.obsession||p.isBrain) && Math.hypot(n.ux,n.uy,n.uz)<0.42) continue;
      const world=[p.center[0]+n.ux*p.r, p.center[1]+n.uy*p.r, p.center[2]+n.uz*p.r];
      const view=xf(V,world);
      if (view[2]>-.25) continue;
      const isFrontier = idx>life-0.06;
      let opacity = 0.85*ember;
      if (isFrontier && !REDUCED) opacity *= 0.75+0.25*Math.sin(performance.now()/1000*3+n.k);
      let rr=r*(0.5+ember*0.5), ggg=gg*(0.5+ember*0.5), bb=b*(0.5+ember*0.5);
      const z=-view[2];
      const fog=Math.max(0,Math.min(.93,(z-9)/26));
      rr=rr+(6+tint[0]*.4-rr)*fog; ggg=ggg+(8+tint[1]*.4-ggg)*fog; bb=bb+(14+tint[2]*.4-bb)*fog;
      const sp=pj(view);
      const rad=Math.max(1.6,(isFrontier?4.6:2.9)*(focal/700));
      const cr=Math.min(255,rr)|0, cg=Math.min(255,ggg)|0, cb=Math.min(255,bb)|0;
      pts.push({z:view[2], x:sp[0], y:sp[1], rad, cr, cg, cb, opacity,
        col:`rgba(${cr},${cg},${cb},${opacity})`});
    }
  }
  pts.sort((a,b)=>a.z-b.z);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for (const p of pts){
    ctx.fillStyle=`rgba(${p.cr},${p.cg},${p.cb},${p.opacity*0.35})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.rad*2.4,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  for (const p of pts){ ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.rad,0,Math.PI*2); ctx.fill(); }

  /* ---- the two solid bodies: dog and brain get real lit geometry,
     not just a denser point cloud — the swarm above is everything they
     filed; this is the thing itself */
  drawHeroCore(DOG_CORE, dogProject.center, dogProject.r*0.62, dogLife, V, pj, m);
  drawHeroCore(BRAIN_CORE, brainProject.center, brainProject.r*0.62, brainLifeForCore, V, pj, m);

  /* ---- brain's threads: once brain exists, faint lines reach back to
     every project that came before it — the turn to remember ---- */
  const brainLife = Math.max(0, Math.min(1,(day-brainProject.sd)/(brainProject.ed-brainProject.sd)));
  if (brainLife>0){
    ctx.save();
    for (const p of PROJECTS){
      if (p===brainProject || p.sd>=brainProject.sd) continue;
      const a=xf(V,brainProject.center), bpt=xf(V,p.center);
      if (a[2]>-.25 || bpt[2]>-.25) continue;
      const A=pj(a), B=pj(bpt);
      ctx.globalAlpha = brainLife*0.16;
      ctx.strokeStyle = 'rgba(232,196,120,1)'; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke();
    }
    ctx.restore();
  }

  /* ---- the aggregate: everything above, gathered into one shape —
     only meaningfully visible once the corridor has been walked.
     Its own growth clock (aggDay) reaches "fully grown" around t=95,
     long before the camera actually arrives at t=150 — verified
     first-hand this was rendering as a permanently-visible, heavily-
     fogged dark smudge in the background for the entire obsession/
     reckoning/late-bloom stretch (t=95-150), undermining the arrival
     as a reveal and reading as a plain visual bug. Gate on screen
     time, not just on story-day, and fade it in rather than pop it. */
  const aggVis = t<128 ? 0 : smootherstep((t-128)/17);
  const rotM=mRotY(rot);
  const aggDay = Math.min(day,46);
  const aggPts=[];
  for (let i=0;aggVis>0.001 && i<AGG_TOTAL;i++){
    const n=aggNodes[i];
    const nage=aggDay-n.day;
    if (nage<0) continue;
    let opacity=Math.min(0.95, nage*2.0)*aggVis;
    if (opacity<=0.01) continue;
    const isFrontier=nage<1.3;
    const local=[n.nx*AGG_R, n.ny*AGG_R, n.nz*AGG_R];
    const world=xf(rotM,local);
    const wpos=[AGG_CENTER[0]+world[0], AGG_CENTER[1]+world[1], AGG_CENTER[2]+world[2]];
    const view=xf(V,wpos);
    if (view[2]>-.25) continue;
    const nrm=xf(rotM,[n.nx,n.ny,n.nz]);
    let d=Math.max(0,dot(nrm,LIGHT));
    const amb=0.14+m*0.22;
    let sh=amb+d*0.7;
    let [r,gg,b]=n.type==='seed'?[57,135,229]:[217,89,38];
    if (i===0){ r=255; gg=214; b=140; sh=Math.max(sh,0.9); }
    r*=sh; gg*=sh; b*=sh; r+=m*34; gg+=m*16;
    if (isFrontier && !REDUCED){ const puls=0.75+0.25*Math.sin(performance.now()/1000*3+n.k); r*=puls; gg*=puls; b*=puls; }
    if (lie>0){ const bias=h2(n.k,7)>0.55?lie:lie*0.15; r=r+(196-r)*bias; gg=gg+(36-gg)*bias; b=b+(30-b)*bias; }
    const z=-view[2];
    const fog=Math.max(0,Math.min(.92,(z-7)/13));
    r=r+(6-r)*fog; gg=gg+(8-gg)*fog; b=b+(14-b)*fog;
    const sp=pj(view);
    const rad=Math.max(1.7,(isFrontier?5.4:3.3)*(focal/700));
    const cr=Math.min(255,r)|0, cg=Math.min(255,gg)|0, cb=Math.min(255,b)|0;
    aggPts.push({z:view[2], x:sp[0], y:sp[1], rad, cr, cg, cb, opacity,
      col:`rgba(${cr},${cg},${cb},${opacity})`});
  }
  aggPts.sort((a,b)=>a.z-b.z);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for (const p of aggPts){
    ctx.fillStyle=`rgba(${p.cr},${p.cg},${p.cb},${p.opacity*0.3})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.rad*2.2,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  for (const p of aggPts){ ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.rad,0,Math.PI*2); ctx.fill(); }

  /* ---- the witness ---- */
  if (wk>0.01){
    const wm=mMul(mTrans(WITNESS_POS[0],WITNESS_POS[1],WITNESS_POS[2]), mScale(0.34*wk,0.34*wk,0.34*wk));
    emitMesh(WITNESS_MESH, wm, V, pj, wk, m);
    const bp=xf(V,WITNESS_POS);
    if (bp[2]<-.3){
      const sx=W/2+bp[0]*focal/-bp[2], sy=H/2-bp[1]*focal/-bp[2];
      const rad=(30+wk*40)*(focal/900);
      const bg=ctx.createRadialGradient(sx,sy,0,sx,sy,Math.max(6,rad));
      bg.addColorStop(0,`rgba(255,214,140,${.5*wk})`); bg.addColorStop(1,"rgba(255,214,140,0)");
      ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    }
  }

  const vg=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*1.05);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,`rgba(0,0,0,${.5+(1-m)*.14})`);
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  if (!inEpilogue && (tint[0]||tint[1]||tint[2])){
    ctx.fillStyle=`rgba(${Math.max(0,tint[0]*7)|0},${Math.max(0,tint[1]*7)|0},${Math.max(0,-tint[2]*4)|0},0.05)`;
    ctx.fillRect(0,0,W,H);
  }
  if (lie>0){ ctx.fillStyle=`rgba(150,20,20,${lie*0.1})`; ctx.fillRect(0,0,W,H); }
  const cut = REDUCED ? 0 : cutAlpha(t);
  if (cut>0){ ctx.fillStyle=`rgba(0,0,0,${cut})`; ctx.fillRect(0,0,W,H); }
}

/* ───────── audio: a mastered bus (dry + synthesized-IR reverb send,
   shelving EQ, soft-clip limiter) instead of every source wired
   straight to ctx.destination — a continuous three-voice drone
   (mood-driven gain AND filter cutoff, slow LFO movement), thumps
   with their own lowpass + a short noise transient for punch, a
   stinger for each lie-pulse, all with light stereo placement. */
let audioCtx=null, droneGain=null, droneGain2=null, droneGain3=null, droneFilter=null;
let masterIn=null, clickBufferCache=null;

function buildSoftClipCurve(){
  const n=1024, curve=new Float32Array(n);
  for (let i=0;i<n;i++){ const x=i/(n-1)*2-1; curve[i]=Math.tanh(x*1.6)/Math.tanh(1.6); }
  return curve;
}
function buildReverbIR(ctx, duration, decay){
  const rate=ctx.sampleRate, length=Math.floor(rate*duration);
  const impulse=ctx.createBuffer(2, length, rate);
  for (let ch=0; ch<2; ch++){
    const data=impulse.getChannelData(ch);
    for (let i=0;i<length;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/length, decay);
  }
  return impulse;
}
function initMasterBus(ctx){
  masterIn=ctx.createGain(); masterIn.gain.value=1;
  const dryGain=ctx.createGain(); dryGain.gain.value=0.82;
  const wetGain=ctx.createGain(); wetGain.gain.value=0.32;
  const convolver=ctx.createConvolver(); convolver.buffer=buildReverbIR(ctx, 2.2, 2.6);
  masterIn.connect(dryGain);
  masterIn.connect(convolver).connect(wetGain);
  const lowShelf=ctx.createBiquadFilter(); lowShelf.type='lowshelf'; lowShelf.frequency.value=170; lowShelf.gain.value=2.5;
  const highShelf=ctx.createBiquadFilter(); highShelf.type='highshelf'; highShelf.frequency.value=6200; highShelf.gain.value=-4.5;
  dryGain.connect(lowShelf); wetGain.connect(lowShelf);
  lowShelf.connect(highShelf);
  const shaper=ctx.createWaveShaper(); shaper.curve=buildSoftClipCurve(); shaper.oversample='4x';
  highShelf.connect(shaper); shaper.connect(ctx.destination);
}
function getClickBuffer(ctx){
  if (clickBufferCache) return clickBufferCache;
  const len=Math.floor(ctx.sampleRate*0.02);
  const buf=ctx.createBuffer(1, len, ctx.sampleRate);
  const d=buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len, 3);
  clickBufferCache=buf;
  return buf;
}
function startDrone(ctx){
  droneFilter=ctx.createBiquadFilter(); droneFilter.type='lowpass'; droneFilter.Q.value=0.7;
  droneFilter.frequency.value=650; droneFilter.connect(masterIn);
  const lfo=ctx.createOscillator(), lfoGain=ctx.createGain();
  lfo.type='sine'; lfo.frequency.value=0.055; lfoGain.gain.value=200;
  lfo.connect(lfoGain).connect(droneFilter.frequency); lfo.start();

  const o1=ctx.createOscillator(), g1=ctx.createGain();
  o1.type='sine'; o1.frequency.value=52; g1.gain.value=0.0001;
  o1.connect(g1).connect(droneFilter); o1.start();
  const o2=ctx.createOscillator(), g2=ctx.createGain();
  o2.type='triangle'; o2.frequency.value=104; g2.gain.value=0.0001;
  o2.connect(g2).connect(droneFilter); o2.start();
  const o3=ctx.createOscillator(), g3=ctx.createGain();
  o3.type='sine'; o3.frequency.value=52*1.5; g3.gain.value=0.0001; // a fifth above — warmth, not dissonance
  o3.connect(g3).connect(droneFilter); o3.start();
  droneGain=g1; droneGain2=g2; droneGain3=g3;
}
function thump(ctx, big, pan){
  const now=ctx.currentTime;
  const panner=ctx.createStereoPanner(); panner.pan.value=pan||0;
  const filt=ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=big?1100:750; filt.Q.value=0.5;
  panner.connect(filt).connect(masterIn);

  const osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(big?150:120,now);
  osc.frequency.exponentialRampToValueAtTime(big?46:52,now+0.16);
  gain.gain.setValueAtTime(0.0001,now); gain.gain.exponentialRampToValueAtTime(big?0.4:0.24,now+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+(big?0.4:0.24));
  osc.connect(gain).connect(panner); osc.start(now); osc.stop(now+(big?0.42:0.26));

  const click=ctx.createBufferSource(); click.buffer=getClickBuffer(ctx);
  const clickGain=ctx.createGain(); clickGain.gain.value=big?0.055:0.032;
  click.connect(clickGain).connect(panner); click.start(now);

  if (big){
    const osc2=ctx.createOscillator(), gain2=ctx.createGain();
    osc2.type='triangle'; osc2.frequency.value=880;
    gain2.gain.setValueAtTime(0.0001, now+0.02);
    gain2.gain.exponentialRampToValueAtTime(0.09, now+0.03);
    gain2.gain.exponentialRampToValueAtTime(0.0001, now+0.22);
    osc2.connect(gain2).connect(panner);
    osc2.start(now+0.02); osc2.stop(now+0.24);
  }
}
function lieStinger(ctx){
  const now=ctx.currentTime;
  const panner=ctx.createStereoPanner(); panner.pan.value=0;
  const filt=ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=1300;
  const osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type='square'; osc.frequency.setValueAtTime(180,now);
  osc.frequency.exponentialRampToValueAtTime(70,now+0.3);
  gain.gain.setValueAtTime(0.0001,now); gain.gain.exponentialRampToValueAtTime(0.1,now+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+0.32);
  osc.connect(gain).connect(filt).connect(panner).connect(masterIn);
  osc.start(now); osc.stop(now+0.34);
}

/* ───────── director */
let t=0, playing=true, last=0, shownLine=-1, firedLine=new Array(LINES.length).fill(false), firedLie=[false,false];
const el={play:document.getElementById("play"),scrub:document.getElementById("scrub"),
  clock:document.getElementById("clock"),narr:document.getElementById("narr"),card:document.getElementById("card"),
  actcard:document.getElementById("actcard"),actcardN:document.getElementById("actcard-n"),actcardT:document.getElementById("actcard-t")};

function applyMoodAudio(m){
  if (!droneGain) return;
  const now=audioCtx.currentTime;
  droneGain.gain.linearRampToValueAtTime(0.015+m*0.045, now+0.08);
  droneGain2.gain.linearRampToValueAtTime(0.009+m*0.028, now+0.08);
  droneGain3.gain.linearRampToValueAtTime(0.005+m*0.017, now+0.08);
  if (droneFilter) droneFilter.frequency.setTargetAtTime(480+m*820, now, 0.6);
}
const BIG_LINES = new Set([2,6,15,18,21]);
function updateActCard(t){
  const card = ACT_CARDS.find(c=>t>=c.t&&t<c.t+c.hold);
  el.actcard.classList.toggle('on', !!card);
  if (card){ el.actcardN.textContent=card.n; el.actcardT.textContent=card.t2; }
}

function frame(now, forced){
  if (!forced) requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  if (!isFinite(dt)||dt<0) dt=0;
  if (dt>1/20) dt=1/20;
  if (playing && !forced){
    t+=dt;
    if (t>=DUR){ t=DUR; playing=false; el.play.textContent="Play"; }
  }
  draw(t);
  if (audioCtx) applyMoodAudio(t>150?mood(t):0.42);

  const line=LINES.find(l=>t>=l.a&&t<l.b);
  const idx=line?LINES.indexOf(line):-1;
  if (idx!==shownLine){
    el.narr.classList.toggle('on', !!line);
    if (line) el.narr.textContent=line.s;
    shownLine=idx;
    if (idx>=0 && !firedLine[idx] && audioCtx){ thump(audioCtx, BIG_LINES.has(idx), ((idx%5)-2)*0.16); firedLine[idx]=true; }
  }
  el.card.classList.toggle("on", t<2.2);
  updateActCard(t);
  LIE_AT.forEach((at,i)=>{ if (t>=at && !firedLie[i]){ firedLie[i]=true; if (audioCtx) lieStinger(audioCtx); } });

  el.scrub.value=Math.round(t*100);
  el.clock.textContent=`${t.toFixed(1)} / ${DUR.toFixed(1)}`;
}

function seek(time){
  playing=false; el.play.textContent="Play";
  t=Math.max(0,Math.min(DUR,time)); shownLine=-2;
  draw(t);
  const line=LINES.find(l=>t>=l.a&&t<l.b);
  el.narr.classList.toggle('on', !!line); if (line) el.narr.textContent=line.s;
  el.card.classList.toggle("on", t<2.2);
  updateActCard(t);
  el.scrub.value=Math.round(t*100);
  el.clock.textContent=`${t.toFixed(1)} / ${DUR.toFixed(1)}`;
}
el.scrub.addEventListener("input", ()=> seek(parseInt(el.scrub.value,10)/100));
el.play.addEventListener("click", ()=>{
  playing=!playing; el.play.textContent=playing?"Pause":"Play";
  if (playing) last=performance.now();
});

resize();

/* KERNEL: reduced-motion still delivers every line of the SAME story,
   without continuous camera/light motion — the visual settles once on
   the final resolved frame, all lines cycle through as instant swaps.
   See memory kernel: reduced-motion-must-not-gate-content-only-motion. */
function playReducedSequence(){
  draw(DUR);
  el.card.classList.remove('on');
  el.actcard.classList.remove('on');
  el.scrub.value=21000; el.clock.textContent=`${DUR.toFixed(1)} / ${DUR.toFixed(1)}`;
  let i=0;
  function step(){
    if (i>=LINES.length){ el.narr.classList.remove('on'); return; }
    el.narr.textContent=LINES[i].s; el.narr.classList.add('on');
    if (audioCtx) thump(audioCtx, BIG_LINES.has(i), ((i%5)-2)*0.16);
    i++;
    setTimeout(step, 850);
  }
  step();
}

BrainIntro.mount({
  onUnlock(ctx){
    audioCtx=ctx;
    if (ctx){ initMasterBus(ctx); startDrone(ctx); }
    if (REDUCED){ playReducedSequence(); }
    else { last=performance.now(); requestAnimationFrame(frame); }
  }
});
})();
</script>
