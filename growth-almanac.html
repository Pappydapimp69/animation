<title>Brain — Growth</title>
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    color-scheme: light dark;
    --bg:#f4f6fa; --bg-deep:#e7ebf2;
    --ink:#161b24; --ink-soft:#4b5566; --ink-faint:#6c7684;
    --line:#d7dde6;
    --seed:#2a78d6; --lesson:#eb6834; --tension:#1baf7a; --signal:#9a6b00;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0a0e15; --bg-deep:#050709;
      --ink:#eef1f6; --ink-soft:#a7afbc; --ink-faint:#7c8492;
      --line:#1c2330;
      --seed:#3987e5; --lesson:#d95926; --tension:#199e70; --signal:#ffd9a8;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0e15; --bg-deep:#050709; --ink:#eef1f6; --ink-soft:#a7afbc; --ink-faint:#7c8492;
    --line:#1c2330; --seed:#3987e5; --lesson:#d95926; --tension:#199e70; --signal:#ffd9a8;
  }
  :root[data-theme="light"]{
    --bg:#f4f6fa; --bg-deep:#e7ebf2; --ink:#161b24; --ink-soft:#4b5566; --ink-faint:#6c7684;
    --line:#d7dde6; --seed:#2a78d6; --lesson:#eb6834; --tension:#1baf7a; --signal:#9a6b00;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:var(--mono); -webkit-font-smoothing:antialiased;
  }
  .stage{position:fixed; inset:0}
  canvas#net{position:absolute; inset:0; display:block; width:100%; height:100%}

  .hud-top{
    position:absolute; top:0; left:0; right:0; padding:clamp(14px,3vw,28px);
    display:flex; justify-content:space-between; pointer-events:none;
    font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint);
  }
  .hud-top .mark{color:var(--ink-soft)}

  .counters{
    position:absolute; left:clamp(14px,3vw,28px); top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:26px; pointer-events:none;
  }
  .counter .n{
    font-size:clamp(28px,5vw,46px); font-variant-numeric:tabular-nums; line-height:1;
    font-weight:600; color:var(--ink); display:block;
  }
  .counter .l{
    display:flex; align-items:center; gap:7px; margin-top:6px;
    font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint);
  }
  .dot{width:7px; height:7px; border-radius:50%; flex:none}
  .counter.seed .dot{background:var(--seed)}
  .counter.lesson .dot{background:var(--lesson)}

  .flash{
    position:absolute; top:clamp(54px,11vh,96px); left:50%; transform:translate(-50%,-6px);
    font-size:clamp(12.5px,2.1vw,16px); font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--signal); opacity:0; transition:opacity .3s ease, transform .3s ease;
    text-align:center; white-space:nowrap; pointer-events:none;
  }
  .flash.on{opacity:1; transform:translate(-50%,0)}
  .flash.big{font-size:clamp(15px,2.8vw,21px)}

  .epilogue{
    position:absolute; right:clamp(14px,3vw,28px); top:50%; transform:translateY(-50%) translateX(8px);
    display:flex; flex-direction:column; gap:18px; text-align:right;
    opacity:0; transition:opacity .6s ease, transform .6s ease; pointer-events:none;
  }
  .epilogue.on{opacity:1; transform:translateY(-50%) translateX(0)}
  .e-stat .n{font-size:clamp(19px,3.2vw,28px); font-variant-numeric:tabular-nums; color:var(--ink); display:block}
  .e-stat .n small{font-size:.55em; color:var(--ink-faint); font-weight:400}
  .e-stat .l{font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin-top:3px}
  .e-stat.tension .n{color:var(--tension)}

  .controls{
    position:absolute; left:50%; bottom:clamp(16px,4vh,32px); transform:translateX(-50%);
    display:flex; align-items:center; gap:12px;
  }
  button{
    -webkit-appearance:none; appearance:none; background:transparent; border:1px solid var(--line);
    color:var(--ink-soft); width:36px; height:36px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  button:hover{border-color:var(--ink-soft); color:var(--ink)}
  button:focus-visible{outline:2px solid var(--seed); outline-offset:2px}
  button svg{width:13px; height:13px}
  input[type=range]{width:min(38vw,220px); accent-color:var(--seed); cursor:pointer}
  input[type=range]:focus-visible{outline:2px solid var(--seed); outline-offset:3px}
  .readout{font-size:10.5px; color:var(--ink-faint); min-width:104px}

  @media (prefers-reduced-motion:reduce){ .flash, .epilogue{transition-duration:.001ms} }
  ::selection{background:var(--seed); color:#fff}

  @media (max-width: 680px){
    .counters{ top:64px; left:14px; transform:none; flex-direction:row; gap:18px }
    .counter .n{ font-size:22px }
    .epilogue{ top:auto; bottom:64px; right:14px; transform:none; flex-direction:row; gap:14px }
    .e-stat .n{ font-size:15px }
    .e-stat .l{ font-size:8.5px }
  }
</style>

<div class="stage">
  <canvas id="net" role="img" aria-label="An animated visualization of two growing clusters of glowing points, one for every idea kept and one for every lesson learned by the Brain cognitive system, accumulated day by day over 46 days."></canvas>

  <div class="hud-top">
    <span class="mark">brain / growth</span>
    <span class="range">jun 14 &rarr; jul 30, 2026</span>
  </div>

  <div class="counters">
    <div class="counter seed">
      <span class="n" id="cSeed">0</span>
      <span class="l"><i class="dot"></i>ideas</span>
    </div>
    <div class="counter lesson">
      <span class="n" id="cLesson">0</span>
      <span class="l"><i class="dot"></i>lessons</span>
    </div>
  </div>

  <div class="flash" id="flash"></div>

  <div class="epilogue" id="epilogue">
    <div class="e-stat"><span class="n" id="eTested">92</span><span class="l">tested</span></div>
    <div class="e-stat"><span class="n" id="eBuilt">26</span><span class="l">built</span></div>
    <div class="e-stat tension"><span class="n">5<small>/25</small></span><span class="l">open</span></div>
  </div>

  <div class="controls">
    <button id="play" type="button" aria-label="Pause">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Move through the days">
    <span class="readout" id="readout">Day 0 &middot; Jun 14</span>
  </div>
</div>

<script>
/* Vendored from Pappydapimp69/Brain, shared/brain-intro.js — the shared
   audio-unlock gesture gate every Brain-derived web app mounts. Copy the
   source file's contents here verbatim when it updates; keep this page
   self-contained rather than depending on a cross-repo asset path. */
(function () {
  "use strict";
  if (customElements.get("brain-intro")) return;

  const INTRO_REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

  class BrainIntroEl extends HTMLElement {
    constructor() {
      super();
      this._fired = false;
      this._onUnlock = null;
      this._label = "you're tapping this — i already know";
      const root = this.attachShadow({ mode: "open" });
      root.innerHTML = `
        <style>
          :host{ all:initial; position:fixed; inset:0; z-index:2147483647; }
          .btn{
            all:unset; box-sizing:border-box; position:absolute; inset:0;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:22px; cursor:pointer; background:#05070c; color:#eef1f6;
            font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
            opacity:1; transition:opacity .35s ease;
          }
          .btn:focus-visible{ outline:2px solid #3987e5; outline-offset:-4px; }
          canvas{ width:120px; height:120px; }
          .label{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#7c8492; text-align:center; padding:0 24px; }
          :host([data-out]) .btn{ opacity:0; pointer-events:none; }
          @media (prefers-reduced-motion:reduce){ .btn{ transition-duration:.001ms; } }
        </style>
        <button class="btn" type="button" part="button">
          <canvas width="120" height="120" aria-hidden="true"></canvas>
          <span class="label"></span>
        </button>
      `;
      this._button = root.querySelector(".btn");
      this._canvas = root.querySelector("canvas");
      this._labelEl = root.querySelector(".label");
    }

    connectedCallback() {
      this._labelEl.textContent = this._label;
      this._button.setAttribute("aria-label", this._label);
      this._raf = null;
      this._t0 = performance.now();
      if (!INTRO_REDUCED) this._animate();
      else this._paint(0);

      const fire = (e) => this._fire(e);
      this._button.addEventListener("pointerdown", fire, { once: true });
      this._button.addEventListener("click", fire, { once: true });

      requestAnimationFrame(() => this._button.focus({ preventScroll: true }));
    }

    disconnectedCallback() {
      if (this._raf) cancelAnimationFrame(this._raf);
    }

    _animate() {
      const step = () => {
        this._paint((performance.now() - this._t0) / 1000);
        this._raf = requestAnimationFrame(step);
      };
      this._raf = requestAnimationFrame(step);
    }

    _paint(t) {
      const ctx = this._canvas.getContext("2d");
      const W = 120, H = 120, cx = 60, cy = 60;
      ctx.clearRect(0, 0, W, H);
      const breathe = INTRO_REDUCED ? 1 : 0.9 + 0.1 * Math.sin(t * 2.1);
      [[-1, "#3987e5"], [1, "#d95926"]].forEach(([side, color]) => {
        const lx = cx + side * 13, ly = cy;
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 14 * breathe;
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.ellipse(lx, ly, 15 * breathe, 18 * breathe, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      if (!INTRO_REDUCED) {
        const p = (t * 0.6) % 1;
        ctx.save();
        ctx.strokeStyle = "#eef1f6";
        ctx.globalAlpha = (1 - p) * 0.35;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(cx, cy, 26 + p * 30, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    _fire(e) {
      if (this._fired) return;
      this._fired = true;

      let audioCtx = null;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          audioCtx = new AC();
          if (audioCtx.state === "suspended") audioCtx.resume();
          this._playSting(audioCtx);
        }
      } catch (err) { /* Web Audio unsupported or blocked — sting/unlock still proceed with null */ }

      if (this._raf) cancelAnimationFrame(this._raf);
      const STING_MS = INTRO_REDUCED ? 0 : 500;
      if (!INTRO_REDUCED) this._stingAnimate(audioCtx);

      setTimeout(() => {
        try {
          if (this._onUnlock) this._onUnlock(audioCtx);
        } finally {
          this.setAttribute("data-out", "");
          const done = () => this.remove();
          if (INTRO_REDUCED) done();
          else this._button.addEventListener("transitionend", done, { once: true });
        }
      }, STING_MS);
    }

    _playSting(ctx) {
      this._stingClock0 = ctx.currentTime;
      const now = this._stingClock0;
      const notes = [
        { f: 392.0, t: 0.0, d: 0.25, g: 0.16 },
        { f: 587.33, t: 0.06, d: 0.25, g: 0.16 },
      ];
      notes.forEach((n) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = n.f;
        gain.gain.setValueAtTime(0, now + n.t);
        gain.gain.linearRampToValueAtTime(n.g, now + n.t + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + n.t + n.d);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now + n.t);
        osc.stop(now + n.t + n.d + 0.05);
      });
    }

    // One clock drives both halves: when Web Audio is available this reads
    // audioCtx.currentTime — the same clock _playSting scheduled against —
    // every frame, so the flash and the ping can't drift apart.
    _stingAnimate(audioCtx) {
      const perf0 = performance.now();
      const step = () => {
        const t = audioCtx ? (audioCtx.currentTime - this._stingClock0) : (performance.now() - perf0) / 1000;
        this._paintSting(Math.min(t, 0.45));
        if (t < 0.45) this._raf = requestAnimationFrame(step);
      };
      this._raf = requestAnimationFrame(step);
    }

    _paintSting(t) {
      const ctx = this._canvas.getContext("2d");
      const W = 120, H = 120, cx = 60, cy = 60;
      ctx.clearRect(0, 0, W, H);
      const conv = Math.min(1, t / 0.45);
      const sep = 13 * (1 - conv * 0.7);
      const scale = 1 + conv * 0.25;
      [[-1, "#3987e5"], [1, "#d95926"]].forEach(([side, color]) => {
        const lx = cx + side * sep, ly = cy;
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 14 * scale;
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.ellipse(lx, ly, 15 * scale, 18 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    set onUnlock(fn) { this._onUnlock = fn; }
    set label(s) { this._label = s; }
  }

  customElements.define("brain-intro", BrainIntroEl);

  window.BrainIntro = {
    mount(opts) {
      opts = opts || {};
      const el = document.createElement("brain-intro");
      if (opts.label) el.label = opts.label;
      el.onUnlock = opts.onUnlock || null;
      document.body.appendChild(el);
      return el;
    },
  };
})();
</script>

<script>
(function(){
"use strict";
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- real data: daily cumulative counts, sampled from full git history ---------- */
const SEED = [
  ["2026-06-27",29],["2026-06-30",39],["2026-07-01",65],["2026-07-02",65],
  ["2026-07-04",67],["2026-07-07",69],["2026-07-08",70],["2026-07-09",82],
  ["2026-07-10",97],["2026-07-11",298],["2026-07-12",376],["2026-07-13",397],
  ["2026-07-15",413],["2026-07-16",437],["2026-07-17",439],["2026-07-18",451],
  ["2026-07-20",482],["2026-07-24",509],["2026-07-26",524],["2026-07-30",527],
];
const LESSON = [
  ["2026-06-14",7],["2026-06-15",17],["2026-06-30",17],["2026-07-01",17],
  ["2026-07-02",44],["2026-07-03",44],["2026-07-04",48],["2026-07-05",72],
  ["2026-07-06",72],["2026-07-07",72],["2026-07-08",72],["2026-07-09",136],
  ["2026-07-10",145],["2026-07-11",200],["2026-07-12",221],["2026-07-13",305],
  ["2026-07-14",305],["2026-07-15",356],["2026-07-16",377],["2026-07-17",377],
  ["2026-07-18",417],["2026-07-20",454],["2026-07-24",478],["2026-07-26",505],
  ["2026-07-30",522],
];
const MILESTONES = [
  {d:"2026-06-30", flash:"first steps", big:false},
  {d:"2026-07-01", flash:"safe-test proven", big:false},
  {d:"2026-07-04", flash:"studied film", big:false},
  {d:"2026-07-09", flash:"studied story, twice", big:false},
  {d:"2026-07-11", flash:"five at once", big:true},
  {d:"2026-07-16", flash:"learned to pitch", big:false},
  {d:"2026-07-18", flash:"calm &middot; mods &middot; co-op", big:false},
  {d:"2026-07-20", flash:"eleven at once", big:false},
  {d:"2026-07-26", flash:"watched, then answered", big:false},
];

const DAY_MS = 86400000;
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d); }
const START = parseD("2026-06-14");
const END = parseD("2026-07-30");
function densify(series){
  const out = [];
  for (let t = START; t <= END; t += DAY_MS){
    let v = 0;
    for (const [d, c] of series) if (parseD(d) <= t) v = c;
    out.push(v);
  }
  return out;
}
const seedDaily = densify(SEED);
const lessonDaily = densify(LESSON);
const totalDays = seedDaily.length - 1;

/* ---------- two hemispheres of nodes, one per real entry, golden-angle spiral fill ---------- */
const GOLDEN = Math.PI*(3-Math.sqrt(5));

function buildNodes(daily){
  const nodes = [];
  let prev = 0;
  for (let day=0; day<daily.length; day++){
    const delta = daily[day]-prev;
    for (let j=0;j<delta;j++) nodes.push({day, k:nodes.length});
    prev = daily[day];
  }
  return nodes;
}
function boundaryAt(angle, off){
  return 0.78 + 0.10*Math.sin(3*angle+off) + 0.09*Math.sin(5*angle+1.7*off) + 0.06*Math.sin(7*angle+2.3*off);
}
function placeNodes(nodes, off){
  const total = nodes.length;
  for (const n of nodes){
    const angle = n.k*GOLDEN;
    const rNorm = Math.sqrt((n.k+0.5)/total);
    const r = rNorm*boundaryAt(angle, off)*0.95;
    n.ux = Math.cos(angle)*r;
    n.uy = Math.sin(angle)*r*0.88;
  }
}
function buildParents(nodes){
  const parent = new Array(nodes.length);
  parent[0] = -1;
  for (let i=1;i<nodes.length;i++){
    let best=-1, bestD=Infinity;
    const a = nodes[i];
    for (let j=0;j<i;j++){
      const b = nodes[j];
      const dx=a.ux-b.ux, dy=a.uy-b.uy;
      const d=dx*dx+dy*dy;
      if (d<bestD){ bestD=d; best=j; }
    }
    parent[i]=best;
  }
  return parent;
}

const seedNodes = buildNodes(seedDaily);
const lessonNodes = buildNodes(lessonDaily);
placeNodes(seedNodes, 1.3);
placeNodes(lessonNodes, 4.1);
const seedParent = buildParents(seedNodes);
const lessonParent = buildParents(lessonNodes);

/* ---------- canvas ---------- */
const stage = document.querySelector('.stage');
const cv = document.getElementById('net');
const ctx = cv.getContext('2d');
let CW=0, CH=0;

function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function hexToRgba(hex, a){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

function resize(){
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio||1, 2);
  CW = r.width; CH = r.height;
  cv.width = Math.round(CW*dpr); cv.height = Math.round(CH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw(dayIndex, punch);
}
let resizeTimer = null;
window.addEventListener('resize', ()=>{ clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 100); });

function geometry(){
  const cx = CW*0.5, cy = CH*0.53;
  const lobeR = Math.min(CW*0.30, CH*0.44);
  return {
    seed:   {x: cx-lobeR*0.60, y: cy, r: lobeR, off: 1.3},
    lesson: {x: cx+lobeR*0.60, y: cy, r: lobeR, off: 4.1},
  };
}

function drawLobeOutline(g, color){
  ctx.beginPath();
  for (let i=0;i<=72;i++){
    const angle = (i/72)*Math.PI*2;
    const rad = boundaryAt(angle, g.off)*0.97;
    const x = g.x+Math.cos(angle)*rad*g.r;
    const y = g.y+Math.sin(angle)*rad*g.r*0.88;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.strokeStyle = color; ctx.lineWidth=1; ctx.globalAlpha=0.28; ctx.stroke(); ctx.globalAlpha=1;
}

function drawCluster(nodes, parent, g, color, dayIdx, punchV, t){
  for (let i=0;i<nodes.length;i++){
    const n = nodes[i];
    const age = dayIdx - n.day;
    if (age < 0) continue;
    let opacity = Math.min(1, age*2.2);
    if (opacity<=0) continue;
    const isFrontier = age < 1.2;
    if (isFrontier && !REDUCED) opacity *= 0.82+0.18*Math.sin(t*3+n.k);
    const x = g.x + n.ux*g.r;
    const y = g.y + n.uy*g.r;

    const p = parent[i];
    if (p>=0){
      const pn = nodes[p];
      const px = g.x+pn.ux*g.r, py = g.y+pn.uy*g.r;
      ctx.save();
      ctx.globalAlpha = opacity*0.5;
      if (isFrontier){ ctx.shadowColor=color; ctx.shadowBlur=6+punchV*10; }
      ctx.strokeStyle = color; ctx.lineWidth = isFrontier?1.1:0.6;
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(x,y); ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = opacity;
    if (isFrontier){ ctx.shadowColor=color; ctx.shadowBlur = 10+punchV*22; }
    ctx.fillStyle = color;
    const rad = isFrontier ? 2.3+punchV*1.6 : 1.4;
    ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

let burstStart = null;
function triggerBurst(){ burstStart = performance.now(); }

function draw(dayIdx, punchV){
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle = css('--bg'); ctx.fillRect(0,0,CW,CH);
  const bgDeepHex = css('--bg-deep');
  const vg = ctx.createRadialGradient(CW/2,CH/2,Math.min(CW,CH)*0.12,CW/2,CH/2,Math.max(CW,CH)*0.72);
  vg.addColorStop(0, hexToRgba(bgDeepHex,0)); vg.addColorStop(1, hexToRgba(bgDeepHex,1));
  ctx.fillStyle = vg; ctx.fillRect(0,0,CW,CH);

  const geo = geometry();
  const t = REDUCED ? 0 : performance.now()/1000;
  drawLobeOutline(geo.seed, css('--seed'));
  drawLobeOutline(geo.lesson, css('--lesson'));
  drawCluster(seedNodes, seedParent, geo.seed, css('--seed'), dayIdx, punchV, t);
  drawCluster(lessonNodes, lessonParent, geo.lesson, css('--lesson'), dayIdx, punchV, t);

  if (burstStart !== null && !REDUCED){
    const elapsed = (performance.now()-burstStart)/1000;
    if (elapsed < 0.9){
      const p = elapsed/0.9;
      ctx.save();
      ctx.globalAlpha = 1-p;
      ctx.strokeStyle = css('--signal'); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(CW*0.5, CH*0.53, 12+p*76, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    } else burstStart = null;
  }
}

/* ---------- playback ---------- */
const el = {
  scrub: document.getElementById('scrub'), play: document.getElementById('play'),
  readout: document.getElementById('readout'), flash: document.getElementById('flash'),
  epilogue: document.getElementById('epilogue'),
  cSeed: document.getElementById('cSeed'), cLesson: document.getElementById('cLesson'),
  playIcon: document.getElementById('playIcon'),
};
const ICON_PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';
const ICON_PLAY  = 'M8 5v14l11-7z';
function setPlayIcon(isPlaying){
  el.playIcon.querySelector('path').setAttribute('d', isPlaying?ICON_PAUSE:ICON_PLAY);
  el.play.setAttribute('aria-label', isPlaying?'Pause':'Play');
}

let playing = false, dayIndex = 0, raf = null, lastT = 0, punch = 0, idleRaf = null;

function fmtDay(idx){
  const t = START + Math.floor(idx)*DAY_MS;
  const label = new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
  return `Day ${Math.floor(idx)} · ${label}`;
}
function showFlash(m){
  el.flash.innerHTML = m.flash;
  el.flash.classList.toggle('big', !!m.big);
  el.flash.classList.add('on');
  if (m.big) punch = 1;
}
function idleGlow(){
  if (!REDUCED){ draw(dayIndex, punch); idleRaf = requestAnimationFrame(idleGlow); }
}
function stopIdle(){ if (idleRaf) cancelAnimationFrame(idleRaf); idleRaf = null; }

function render(){
  draw(dayIndex, punch);
  el.scrub.value = Math.round((dayIndex/totalDays)*1000);
  el.readout.textContent = fmtDay(Math.min(dayIndex, totalDays));
  const shownDay = Math.min(Math.floor(dayIndex), totalDays);
  el.cSeed.textContent = seedDaily[shownDay];
  el.cLesson.textContent = lessonDaily[shownDay];
  el.epilogue.classList.toggle('on', dayIndex >= totalDays);
  stopIdle();
  if (!REDUCED) idleGlow();
}
function stopPlay(){ playing=false; setPlayIcon(false); if(raf) cancelAnimationFrame(raf); }

function seekToDay(idx){
  stopPlay(); punch = 0; el.flash.classList.remove('on');
  dayIndex = Math.max(0, Math.min(totalDays, idx));
  render();
}
el.scrub.addEventListener('input', ()=> seekToDay(Math.round((el.scrub.value/1000)*totalDays)) );

const milestoneStops = MILESTONES
  .map(m => ({ m, idx: Math.round((parseD(m.d)-START)/DAY_MS) }))
  .sort((a,b) => a.idx - b.idx);

function startPlay(){
  stopIdle();
  playing = true; setPlayIcon(true);
  el.flash.classList.remove('on'); el.epilogue.classList.remove('on');
  punch = 0; dayIndex = 0;
  const DAYS_PER_SEC = 6.5;
  let stopI = 0;

  function travelTo(target, onArrive){
    stopIdle();
    lastT = performance.now();
    function step(now){
      if (!playing) return;
      const dt = (now-lastT)/1000; lastT = now;
      dayIndex = Math.min(target, dayIndex + dt*DAYS_PER_SEC);
      if (punch > 0) punch = Math.max(0, punch - 0.045);
      draw(dayIndex, punch);
      el.scrub.value = Math.round((dayIndex/totalDays)*1000);
      el.readout.textContent = fmtDay(dayIndex);
      const shownDay = Math.min(Math.floor(dayIndex), totalDays);
      el.cSeed.textContent = seedDaily[shownDay];
      el.cLesson.textContent = lessonDaily[shownDay];
      if (dayIndex >= target){ onArrive(); return; }
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }
  function next(){
    if (!playing) return;
    if (stopI >= milestoneStops.length){ travelTo(totalDays, ()=>{ stopPlay(); render(); }); return; }
    const {m, idx} = milestoneStops[stopI++];
    travelTo(idx, ()=>{
      if (!playing) return;
      showFlash(m);
      triggerBurst();
      idleGlow();
      const hold = m.big ? 1900 : 1250;
      setTimeout(()=>{
        if (!playing) return;
        el.flash.classList.remove('on');
        setTimeout(next, 200);
      }, hold);
    });
  }
  next();
}
el.play.addEventListener('click', ()=>{ if (playing){ stopPlay(); return; } startPlay(); });

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>draw(dayIndex,punch));
new MutationObserver(()=>draw(dayIndex,punch)).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

resize();
setPlayIcon(false);
BrainIntro.mount({
  onUnlock(){
    if (REDUCED){ dayIndex = totalDays; render(); }
    else { requestAnimationFrame(startPlay); }
  }
});
})();
</script>
