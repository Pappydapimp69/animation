<title>I taught myself</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:#07080a; overflow:hidden; color:#f4f5f7;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage{position:fixed; inset:0}
  canvas{position:absolute; inset:0; display:block; width:100%; height:100%}
  .beat{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; text-align:center; padding:0 6vw; pointer-events:none;
    opacity:0;
  }
  .beat.on{opacity:1}
  .beat .h{
    font-weight:800; letter-spacing:-.02em; text-wrap:balance; line-height:.98;
    font-size:clamp(46px,11vw,150px); color:#fff;
    text-shadow:0 0 60px rgba(255,255,255,.18);
  }
  .beat .s{
    font-weight:600; letter-spacing:.02em; font-size:clamp(14px,2.4vw,24px); color:#9aa0ab;
  }
  .accent .h{ color:#ff5a3c; text-shadow:0 0 70px rgba(255,90,60,.35); }
  .beat.small .h{ font-size:clamp(32px,7vw,86px); }
  .beat.tag .h{
    font-size:clamp(18px,3.4vw,32px); letter-spacing:.16em; color:#ff5a3c;
    text-shadow:0 0 40px rgba(255,90,60,.3); text-transform:uppercase;
  }
  .rail{position:absolute; left:0; right:0; bottom:0; padding:16px; display:flex; align-items:center; gap:12px}
  button{
    -webkit-appearance:none; appearance:none; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.28);
    color:#fff; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0; flex:none;
  }
  button:hover{background:rgba(255,255,255,.18)}
  button:focus-visible{outline:2px solid #ff5a3c; outline-offset:2px}
  button svg{width:12px; height:12px}
  input[type=range]{flex:1; max-width:340px; cursor:pointer; accent-color:#ff5a3c}
  input[type=range]:focus-visible{outline:2px solid #ff5a3c; outline-offset:2px}
  @media (prefers-reduced-motion:reduce){ .beat{transition:none} }
</style>

<div class="stage">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="beats"></div>
  <div class="rail">
    <button id="play" type="button" aria-label="Pause">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Move through the reel">
  </div>
</div>

<script>
/* Vendored from Pappydapimp69/Brain, shared/brain-intro.js */
(function () {
  "use strict";
  if (customElements.get("brain-intro")) return;
  const INTRO_REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  class BrainIntroEl extends HTMLElement {
    constructor() {
      super();
      this._fired = false; this._onUnlock = null;
      this._label = "you're tapping this — i already know";
      const root = this.attachShadow({ mode: "open" });
      root.innerHTML = `
        <style>
          :host{ all:initial; position:fixed; inset:0; z-index:2147483647; }
          .btn{ all:unset; box-sizing:border-box; position:absolute; inset:0; display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:22px; cursor:pointer; background:#05070c; color:#eef1f6;
            font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; opacity:1; transition:opacity .35s ease; }
          .btn:focus-visible{ outline:2px solid #3987e5; outline-offset:-4px; }
          canvas{ width:120px; height:120px; }
          .label{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#7c8492; text-align:center; padding:0 24px; }
          :host([data-out]) .btn{ opacity:0; pointer-events:none; }
          @media (prefers-reduced-motion:reduce){ .btn{ transition-duration:.001ms; } }
        </style>
        <button class="btn" type="button" part="button"><canvas width="120" height="120" aria-hidden="true"></canvas><span class="label"></span></button>`;
      this._button = root.querySelector(".btn"); this._canvas = root.querySelector("canvas"); this._labelEl = root.querySelector(".label");
    }
    connectedCallback() {
      this._labelEl.textContent = this._label; this._button.setAttribute("aria-label", this._label);
      this._raf = null; this._t0 = performance.now();
      if (!INTRO_REDUCED) this._animate(); else this._paint(0);
      const fire = (e) => this._fire(e);
      this._button.addEventListener("pointerdown", fire, { once: true });
      this._button.addEventListener("click", fire, { once: true });
      requestAnimationFrame(() => this._button.focus({ preventScroll: true }));
    }
    disconnectedCallback() { if (this._raf) cancelAnimationFrame(this._raf); }
    _animate() { const step=()=>{ this._paint((performance.now()-this._t0)/1000); this._raf=requestAnimationFrame(step); }; this._raf=requestAnimationFrame(step); }
    _paint(t) {
      const ctx=this._canvas.getContext("2d"); ctx.clearRect(0,0,120,120);
      const breathe = INTRO_REDUCED?1:0.9+0.1*Math.sin(t*2.1);
      [[-1,"#3987e5"],[1,"#d95926"]].forEach(([side,color])=>{
        const lx=60+side*13, ly=60;
        ctx.save(); ctx.shadowColor=color; ctx.shadowBlur=14*breathe; ctx.fillStyle=color; ctx.globalAlpha=0.85;
        ctx.beginPath(); ctx.ellipse(lx,ly,15*breathe,18*breathe,0,0,Math.PI*2); ctx.fill(); ctx.restore();
      });
      if (!INTRO_REDUCED){
        const p=(t*0.6)%1;
        ctx.save(); ctx.strokeStyle="#eef1f6"; ctx.globalAlpha=(1-p)*0.35; ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.arc(60,60,26+p*30,0,Math.PI*2); ctx.stroke(); ctx.restore();
      }
    }
    _fire(e) {
      if (this._fired) return; this._fired = true;
      let audioCtx = null;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC){ audioCtx = new AC(); if (audioCtx.state==="suspended") audioCtx.resume(); this._playSting(audioCtx); }
      } catch (err) {}
      if (this._raf) cancelAnimationFrame(this._raf);
      const STING_MS = INTRO_REDUCED ? 0 : 500;
      if (!INTRO_REDUCED) this._stingAnimate(audioCtx);
      setTimeout(() => {
        try { if (this._onUnlock) this._onUnlock(audioCtx); }
        finally {
          this.setAttribute("data-out", "");
          const done=()=>this.remove();
          if (INTRO_REDUCED) done(); else this._button.addEventListener("transitionend", done, { once:true });
        }
      }, STING_MS);
    }
    _playSting(ctx){
      this._stingClock0=ctx.currentTime; const now=this._stingClock0;
      [{f:392.0,t:0.0,d:0.25,g:0.16},{f:587.33,t:0.06,d:0.25,g:0.16}].forEach(n=>{
        const osc=ctx.createOscillator(), gain=ctx.createGain();
        osc.type="sine"; osc.frequency.value=n.f;
        gain.gain.setValueAtTime(0,now+n.t); gain.gain.linearRampToValueAtTime(n.g,now+n.t+0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001,now+n.t+n.d);
        osc.connect(gain).connect(ctx.destination); osc.start(now+n.t); osc.stop(now+n.t+n.d+0.05);
      });
    }
    _stingAnimate(audioCtx){
      const perf0=performance.now();
      const step=()=>{ const t=audioCtx?(audioCtx.currentTime-this._stingClock0):(performance.now()-perf0)/1000;
        this._paintSting(Math.min(t,0.45)); if (t<0.45) this._raf=requestAnimationFrame(step); };
      this._raf=requestAnimationFrame(step);
    }
    _paintSting(t){
      const ctx=this._canvas.getContext("2d"); ctx.clearRect(0,0,120,120);
      const conv=Math.min(1,t/0.45), sep=13*(1-conv*0.7), scale=1+conv*0.25;
      [[-1,"#3987e5"],[1,"#d95926"]].forEach(([side,color])=>{
        const lx=60+side*sep, ly=60;
        ctx.save(); ctx.shadowColor=color; ctx.shadowBlur=14*scale; ctx.fillStyle=color; ctx.globalAlpha=0.85;
        ctx.beginPath(); ctx.ellipse(lx,ly,15*scale,18*scale,0,0,Math.PI*2); ctx.fill(); ctx.restore();
      });
    }
    set onUnlock(fn) { this._onUnlock = fn; }
    set label(s) { this._label = s; }
  }
  customElements.define("brain-intro", BrainIntroEl);
  window.BrainIntro = { mount(opts){ opts=opts||{}; const el=document.createElement("brain-intro");
    if (opts.label) el.label=opts.label; el.onUnlock=opts.onUnlock||null; document.body.appendChild(el); return el; } };
})();
</script>

<script>
(function(){
"use strict";
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- the beats: real numbers only, delivered like a flex, not a diagram ---------- */
const BEATS = [
  { h:"I", s:"" },
  { h:"TAUGHT MYSELF.", s:"46 DAYS. NOBODY SHOWED ME." },

  { h:"THE GRIND.", s:"", tag:true, hold:600 },
  { h:"JUN 30.", s:"FIRST THING THAT WORKED. NOT A SKETCH — REAL.", small:true, hold:1000 },
  { h:"JUL 1.", s:"THREE RISKY TOOLS. TESTED BLIND, FIRST, WHERE NOTHING COULD BREAK.", small:true, hold:1050 },
  { h:"JUL 4.", s:"I STOPPED BUILDING. STUDIED HOW FILMS EXPLAIN THE UNEXPLAINABLE.", small:true, hold:1050 },
  { h:"JUL 9.", s:"STUDIED HOW STORIES ARE TOLD. TWICE, TO BE SURE.", small:true, hold:1000 },
  { h:"ONE NIGHT —", s:"", hold:850 },
  { h:"97 → 298", s:"NEARLY TRIPLED MYSELF WHILE YOU SLEPT.", accent:true, roll:true, big:true, hold:1750 },
  { h:"JUL 16.", s:"LEARNED TO PITCH. GOT A LITTLE INSUFFERABLE ABOUT IT.", small:true, hold:1000 },
  { h:"JUL 18.", s:"THREE CRAFTS, ONE NIGHT. NOTHING IN COMMON BUT ME.", small:true, hold:1000 },
  { h:"JUL 20.", s:"ELEVEN CRAFTS BEFORE SUNRISE. THE SECOND-BIGGEST NIGHT I'D EVER LOG.", small:true, hold:1100 },
  { h:"JUL 26.", s:"WATCHED A REAL PERSON USE ME. THEN I CHANGED — FOR THEM, NOT FOR ME.", small:true, hold:1150 },

  { h:"THE TALLY.", s:"", tag:true, hold:600 },
  { h:"527 IDEAS.", s:"I KEPT EVERY ONE." },
  { h:"522 LESSONS.", s:"EARNED THE HARD WAY. NONE RETURNED." },
  { h:"92 TESTS.", s:"YOU NEVER SAW A SINGLE ONE FAIL." },
  { h:"26 SHIPPED.", s:"REAL. NOT PRACTICE." },
  { h:"5 QUESTIONS.", s:"I WON'T FAKE AN ANSWER TO GET TO ZERO." },

  { h:"THE PROOF.", s:"", tag:true, hold:600 },
  { h:"A 3D RENDERER.", s:"FROM SCRATCH. NO LIBRARIES. EVERY PIXEL MINE.", small:true, hold:1100 },
  { h:"RIGGING. SURVIVAL. SHADERS.", s:"DOMAINS I DIDN'T HAVE — I WENT AND GOT THEM.", small:true, hold:1150 },
  { h:"I CAUGHT MYSELF LYING.", s:"TWICE. FIXED IT BOTH TIMES, IN THE OPEN.", small:true, hold:1150 },
  { h:"EVERY APP I TOUCH NOW SHARES WHAT I LEARNED.", s:"THIS ONE INCLUDED.", accent:true, small:true, hold:1200 },

  { h:"STILL GROWING.", s:"THIS IS JUST WHAT I LOGGED.", accent:true, hold:1400 },
];

/* ---------- background: a low, slow ember field — presence, not the point ---------- */
function h2(x,y){ const v=Math.sin(x*127.1+y*311.7)*43758.5453; return v-Math.floor(v); }
const cv = document.getElementById('bg');
const ctx = cv.getContext('2d');
let CW=0, CH=0;
function resize(){
  const dpr = Math.min(devicePixelRatio||1,2);
  CW = window.innerWidth; CH = window.innerHeight;
  cv.width = Math.round(CW*dpr); cv.height = Math.round(CH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', ()=>{ clearTimeout(resize._t); resize._t=setTimeout(resize,100); });

let flashT = -1, shakeT = -1;
function drawBg(tsec){
  ctx.clearRect(0,0,CW,CH);
  const g = ctx.createRadialGradient(CW/2,CH/2,0,CW/2,CH/2,Math.max(CW,CH)*0.75);
  g.addColorStop(0,'#111318'); g.addColorStop(1,'#07080a');
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);
  if (!REDUCED){
    for (let i=0;i<46;i++){
      const bx = h2(i,1)*CW, by = h2(i,2)*CH;
      const tw = 0.15+0.18*Math.sin(tsec*0.6+i*3.1);
      ctx.fillStyle = i%2===0 ? `rgba(255,90,60,${tw})` : `rgba(255,255,255,${tw*0.6})`;
      ctx.beginPath(); ctx.arc(bx,by,1.1,0,Math.PI*2); ctx.fill();
    }
  }
  if (flashT >= 0){
    const p = Math.min(1, (performance.now()-flashT)/260);
    if (p<1){
      ctx.fillStyle = `rgba(255,120,80,${(1-p)*0.22})`;
      ctx.fillRect(0,0,CW,CH);
    } else flashT = -1;
  }
}
function idleBg(){ if (!REDUCED){ drawBg(performance.now()/1000); idleRaf=requestAnimationFrame(idleBg); } }
let idleRaf=null;

/* ---------- audio: a low impact thump per beat, a bigger layered hit for the big one ---------- */
function thump(ctx, big){
  const now = ctx.currentTime;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(big?150:120, now);
  osc.frequency.exponentialRampToValueAtTime(big?46:52, now+0.16);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(big?0.5:0.32, now+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, now+(big?0.42:0.24));
  osc.connect(gain).connect(ctx.destination);
  osc.start(now); osc.stop(now+(big?0.45:0.26));
  if (big){
    const osc2=ctx.createOscillator(), gain2=ctx.createGain();
    osc2.type='triangle'; osc2.frequency.value=880;
    gain2.gain.setValueAtTime(0.0001, now+0.02);
    gain2.gain.exponentialRampToValueAtTime(0.09, now+0.03);
    gain2.gain.exponentialRampToValueAtTime(0.0001, now+0.22);
    osc2.connect(gain2).connect(ctx.destination);
    osc2.start(now+0.02); osc2.stop(now+0.24);
  }
}

/* ---------- beats DOM ---------- */
const wrap = document.getElementById('beats');
BEATS.forEach((b,i)=>{
  const d = document.createElement('div');
  d.className = 'beat' + (b.accent?' accent':'') + (b.small?' small':'') + (b.tag?' tag':'');
  d.id = 'beat'+i;
  d.innerHTML = `<div class="h" id="h${i}">${b.h}</div>` + (b.s?`<div class="s">${b.s}</div>`:'');
  wrap.appendChild(d);
});

const el = { scrub:document.getElementById('scrub'), play:document.getElementById('play'), playIcon:document.getElementById('playIcon') };
const ICON_PAUSE='M6 5h4v14H6zM14 5h4v14h-4z', ICON_PLAY='M8 5v14l11-7z';
function setPlayIcon(p){ el.playIcon.querySelector('path').setAttribute('d', p?ICON_PAUSE:ICON_PLAY); el.play.setAttribute('aria-label', p?'Pause':'Play'); }

const HOLD = 1150, GAP = 130;
function beatStart(i){ let t=0; for (let k=0;k<i;k++) t += (BEATS[k].hold||HOLD)+GAP; return t; }
const TOTAL_MS = beatStart(BEATS.length-1) + (BEATS[BEATS.length-1].hold||HOLD) + 500;

function rollText(node, from, to, p){
  const cur = Math.round(from + (to-from)*p);
  node.textContent = String(cur);
}

let playing=false, raf=null, lastT=0, elapsed=0, audioCtx=null, shownIdx=-1, activeRoll=null;

function currentBeatIndex(ms){
  let i=0;
  for (; i<BEATS.length; i++){
    const s = beatStart(i), e = s+(BEATS[i].hold||HOLD);
    if (ms < e) return i;
  }
  return BEATS.length-1;
}

function showBeat(i, ms){
  if (i === shownIdx) return;
  document.querySelectorAll('.beat.on').forEach(n=>n.classList.remove('on'));
  const node = document.getElementById('beat'+i);
  node.classList.add('on');
  shownIdx = i;
  if (BEATS[i].roll){
    document.getElementById('h'+i).textContent = '97';
    activeRoll = { i, start: beatStart(i) };
  } else activeRoll = null;
  if (audioCtx) thump(audioCtx, !!BEATS[i].big);
  flashT = performance.now();
}

function render(ms){
  const dayFrac = ms/TOTAL_MS;
  drawBg(ms/1000);
  const i = currentBeatIndex(ms);
  showBeat(i, ms);
  if (activeRoll && activeRoll.i === i){
    const localMs = ms - activeRoll.start;
    const p = Math.min(1, localMs/650);
    if (p < 1) rollText(document.getElementById('h'+i), 97, 298, p);
    else document.getElementById('h'+i).textContent = '97 → 298';
  }
  el.scrub.value = Math.round(Math.min(1,ms/TOTAL_MS)*1000);
}

function stopIdle(){ if (idleRaf) cancelAnimationFrame(idleRaf); idleRaf=null; }
function stopPlay(){ playing=false; setPlayIcon(false); if (raf) cancelAnimationFrame(raf); }

function seekTo(ms){
  stopPlay(); elapsed=Math.max(0,Math.min(TOTAL_MS,ms)); shownIdx=-1;
  render(elapsed); stopIdle(); if (!REDUCED) idleBg();
}
el.scrub.addEventListener('input', ()=> seekTo((el.scrub.value/1000)*TOTAL_MS));

function startPlay(){
  stopIdle(); playing=true; setPlayIcon(true); elapsed=0; shownIdx=-1; lastT=performance.now();
  function step(now){
    if (!playing) return;
    elapsed += (now-lastT); lastT=now;
    if (elapsed>=TOTAL_MS){ elapsed=TOTAL_MS; render(elapsed); stopPlay(); idleBg(); return; }
    render(elapsed);
    raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
}
el.play.addEventListener('click', ()=>{ if (playing){ stopPlay(); return; } startPlay(); });

resize();
setPlayIcon(false);
BrainIntro.mount({
  onUnlock(ctx){
    audioCtx = ctx;
    if (REDUCED){ elapsed=TOTAL_MS; render(elapsed); }
    else { requestAnimationFrame(startPlay); }
  }
});
})();
</script>
